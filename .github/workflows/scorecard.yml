name: Scorecard

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analysis:
    if: github.event.repository.private != true
    name: scorecard
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Read workflow metadata used during Scorecard analysis.
      contents: read # Read repository contents for Scorecard checks.
      id-token: write # Mint an OIDC token for Scorecard provenance integration.
      security-events: write # Upload the Scorecard SARIF report to the Security tab.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
