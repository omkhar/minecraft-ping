name: Release Drafter

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  update_release_draft:
    name: release-drafter
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Update the draft release contents for the default branch.
      pull-requests: read # Read merged pull request metadata for release note generation.
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
