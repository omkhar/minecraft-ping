name: Bug report
description: Report incorrect behavior or a regression
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This document uses ASD-STE100 Simplified Technical English.
        Provide enough detail to reproduce the problem.
  - type: input
    id: version
    attributes:
      label: Version
      description: Provide the release tag, commit, or `minecraft-ping -V` output.
      placeholder: v2.0.0
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Java
        - Bedrock
        - Both
        - Not sure
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Provide the exact command that reproduces the issue.
      placeholder: minecraft-ping --bedrock -c 3 play.example.com
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide the operating system, architecture, network details, and other relevant information.
    validations:
      required: true
