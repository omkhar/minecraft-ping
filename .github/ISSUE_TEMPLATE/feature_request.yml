name: Feature request
description: Propose a change to the CLI, protocol support, or contributor workflow
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        This document uses ASD-STE100 Simplified Technical English.
        Describe the user problem before you describe the proposed change.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Which user task is difficult or impossible now?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
